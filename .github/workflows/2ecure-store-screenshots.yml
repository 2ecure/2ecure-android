# Store screenshots of the Android app: an emulator runs the app bundle of an earlier release build, Maestro signs in as
# the demo persona Lena (demo/README.md in the 2ecure-messenger project) and takes the pictures in English and German.
# Source of this file and of .github/scripts/store-screenshots/: mobile/android/store-screenshots/ in that project.
#
# Secrets: SHOTS_USERNAME, SHOTS_PASSWORD, SHOTS_RECOVERY_KEY (masked in the log). This repository is public: the
# pictures are an artifact (demo content only); anything that could show a secret (Maestro's output, the screen of a
# failed step) is only uploaded encrypted with debug-public-key.pem, whose private key is kept off GitHub.
name: Store screenshots

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: "Run ID of a release build whose App Bundle artifact (2ecure-android-aab-<n>) should be used"
        required: true
      aab_artifact:
        description: "Name of that artifact, e.g. 2ecure-android-aab-11"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: store-screenshots

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: App bundle from the release run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.aab_artifact }}
          run-id: ${{ inputs.release_run_id }}
          github-token: ${{ github.token }}
          path: aab
      - name: Tools (bundletool, Maestro, KVM)
        run: |
          set -euo pipefail
          mv "$(find aab -name '*.aab' | head -1)" app.aab
          V=$(curl -fsSL https://api.github.com/repos/google/bundletool/releases/latest | jq -r .tag_name)
          curl -fsSL -o bundletool.jar "https://github.com/google/bundletool/releases/download/$V/bundletool-all-$V.jar"
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Pictures on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          MAESTRO_USERNAME: ${{ secrets.SHOTS_USERNAME }}
          MAESTRO_PASSWORD: ${{ secrets.SHOTS_PASSWORD }}
          MAESTRO_RECOVERY_KEY: ${{ secrets.SHOTS_RECOVERY_KEY }}
          MAESTRO_CLI_NO_ANALYTICS: "1"
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_7
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 4G
          script: bash .github/scripts/store-screenshots/run.sh
      - name: Pictures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots-${{ github.run_number }}
          path: shots/
          retention-days: 7
          if-no-files-found: ignore
      - name: Encrypt the debug output
        if: failure()
        run: |
          set -euo pipefail
          [ -d debug ] || exit 0
          tar czf debug.tgz debug
          openssl rand 32 > k.bin
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:k.bin -in debug.tgz -out debug.tgz.enc
          openssl pkeyutl -encrypt -pubin -inkey .github/scripts/store-screenshots/debug-public-key.pem \
            -pkeyopt rsa_padding_mode:oaep -in k.bin -out k.bin.enc
          rm -rf debug debug.tgz k.bin
      - name: Debug output (encrypted)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots-debug-${{ github.run_number }}
          path: |
            debug.tgz.enc
            k.bin.enc
          retention-days: 7
          if-no-files-found: ignore
