# Sign the CI device out again (removes the device and its pusher from Lena's account).
appId: com.twoecure.messenger
---
- launchApp:
    stopApp: true
- tapOn:
    id: "home_screen-settings"
- scrollUntilVisible:
    element: "Remove this device|Dieses Gerät entfernen"
    direction: DOWN
    timeout: 20000
- tapOn: "Remove this device|Dieses Gerät entfernen"
# With the key backup up to date the app asks in a dialog; otherwise it shows a sign-out screen first.
- runFlow:
    when:
      visible:
        id: "sign-out-submit"
    commands:
      - tapOn:
          id: "sign-out-submit"
- tapOn:
    id: "dialog-positive"
    optional: true
- tapOn:
    text: "Remove this device|Dieses Gerät entfernen"
    index: 1
    optional: true
- extendedWaitUntil:
    visible: "Sign in to .*|Anmelden bei .*"
    timeout: 60000
