appId: com.twoecure.messenger
---
- runFlow: find-room.yaml
- tapOn: ${ROOM}
- extendedWaitUntil:
    visible:
      id: "text_editor"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
# SCROLL=up: one swipe towards older messages.
# FOCUS: a text to centre on screen (exact, unlike swipes), e.g. the poll's question; the date label that floats at the
# top of the timeline then stays above it.
- runFlow:
    when:
      true: ${FOCUS != ''}
    commands:
      - scrollUntilVisible:
          element: ${FOCUS}
          direction: UP
          timeout: 30000
          centerElement: true
      - waitForAnimationToEnd:
          timeout: 5000
- runFlow:
    when:
      true: ${SCROLL == 'up'}
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 72%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 5000
      # The date label that floats over the timeline while scrolling fades after a moment.
      - extendedWaitUntil:
          notVisible: ".*(September|Oktober|October).*"
          timeout: 6000
          optional: true
- takeScreenshot: ${SHOTS}/${NAME}
- runFlow: back-to-list.yaml
- scrollUntilVisible:
    element: "Sara Meier"
    direction: UP
    timeout: 30000
