appId: com.twoecure.messenger
---
- runFlow: find-room.yaml
- tapOn: ${ROOM}
- extendedWaitUntil:
    visible:
      id: "text_editor"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
# SCROLL=up (one screen-swipe) or up2 (two): show older messages, e.g. the poll in Touren & Treffpunkte.
- runFlow:
    when:
      true: ${SCROLL == 'up2'}
    commands:
      # A shorter second swipe: the date label floating at the top of the timeline must not cover the poll's question.
      - swipe:
          start: 50%, 30%
          end: 50%, 58%
          duration: 1200
- runFlow:
    when:
      true: ${SCROLL == 'up' || SCROLL == 'up2'}
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 72%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 5000
      # The date label that floats over the timeline while scrolling fades after a moment.
      - extendedWaitUntil:
          notVisible: ".*(September|Oktober|October).*"
          timeout: 6000
          optional: true
- takeScreenshot: ${SHOTS}/${NAME}
- runFlow: back-to-list.yaml
- scrollUntilVisible:
    element: "Sara Meier"
    direction: UP
    timeout: 30000
