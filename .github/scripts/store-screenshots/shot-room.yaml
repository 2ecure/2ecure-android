appId: com.twoecure.messenger
---
- runFlow: find-room.yaml
- tapOn: ${ROOM}
- extendedWaitUntil:
    visible:
      id: "text_editor"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
# SCROLL=up: show older messages (the poll in Touren & Treffpunkte sits above the last screenful).
- runFlow:
    when:
      true: ${SCROLL == 'up'}
    commands:
      - swipe:
          start: 50%, 30%
          end: 50%, 72%
          duration: 900
      - waitForAnimationToEnd:
          timeout: 5000
      # The date label that floats over the timeline while scrolling fades after a moment.
      - extendedWaitUntil:
          notVisible: ".*(September|Oktober|October).*"
          timeout: 6000
          optional: true
- takeScreenshot: ${SHOTS}/${NAME}
- runFlow: back-to-list.yaml
- scrollUntilVisible:
    element: "Sara Meier"
    direction: UP
    timeout: 30000
