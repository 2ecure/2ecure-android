appId: com.twoecure.messenger
---
- scrollUntilVisible:
    element: ${ROOM}
    direction: DOWN
    timeout: 30000
- tapOn: ${ROOM}
- extendedWaitUntil:
    visible:
      id: "text_editor"
    timeout: 30000
    optional: true
- waitForAnimationToEnd:
    timeout: 10000
- takeScreenshot: ${SHOTS}/${NAME}
- runFlow: back-to-list.yaml
- scrollUntilVisible:
    element: "Sara Meier"
    direction: UP
    timeout: 30000
